services:
  cq:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEV_AUTH_BYPASS: "false"
