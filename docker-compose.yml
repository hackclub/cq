services:
  cq:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    deploy:
      replicas: ${CQ_REPLICAS:-1}
      resources:
        limits:
          cpus: "0.1"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEV_AUTH_BYPASS: "false"
